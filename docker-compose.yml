version: '3.8'

services:
  api:
    build: .
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - vex_shared_data:/app/data
    environment:
      - VEX_QDRANT_URL=http://qdrant:6333
      - VEX_DATA_DIR=/app/data/.vex_data
      - VEX_TEMP_DIR=/app/data/temp_uploads
    depends_on:
      - qdrant

  worker:
    build: .
    command: huey_consumer.py src.tasks.huey
    volumes:
      - vex_shared_data:/app/data
    environment:
      - VEX_QDRANT_URL=http://qdrant:6333
      - VEX_DATA_DIR=/app/data/.vex_data
      - VEX_TEMP_DIR=/app/data/temp_uploads
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  vex_shared_data:
  qdrant_storage: